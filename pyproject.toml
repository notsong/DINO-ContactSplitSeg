[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dino-contactsplitseg"
version = "0.1.0"
description = "DINOv3-based fine-grained instance segmentation for touching metallographic specimens"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "opencv-python>=4.8", "scipy>=1.11", "scikit-image>=0.22", "PyYAML>=6.0", "Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]
export = ["onnx>=1.16", "onnxruntime>=1.18"]

[tool.setuptools.packages.find]
include = ["contactsplit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
